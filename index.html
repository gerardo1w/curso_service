
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Primera Página con Git 🚀</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(circle at top, rgba(255, 255, 255, 0.18), transparent 35%),
        linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #f8fafc;
      text-align: center;
    }

    .card {
      width: min(720px, 100%);
      padding: 2.5rem 2rem;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      letter-spacing: -0.04em;
    }

    p {
      margin: 1rem auto;
      font-size: 1.05rem;
      line-height: 1.75;
      max-width: 42rem;
      color: #e2e8f0;
    }

    .date-text {
      margin-top: 1rem;
      font-weight: 600;
      color: #d8dee9;
    }

    hr {
      border: none;
      height: 1px;
      background: rgba(255, 255, 255, 0.18);
      margin: 2rem auto;
      width: 80%;
    }

    footer {
      margin-top: 1.5rem;
      color: rgba(248, 250, 252, 0.72);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>¡Hola Mundo!</h1>
    <p>Bienvenido a mi primera página con Git. Ahora es una página mejorada con diseño moderno, compatibilidad móvil y una fecha actualizada automáticamente.</p>
    <p class="date-text" id="fecha"></p>
    <hr>
    <h2>¡Git funciona perfectamente! 🎉</h2>
    <footer>Generado dinámicamente con JavaScript.</footer>
  </main>
  <script>
    const fechaElemento = document.getElementById('fecha');

    const formatearFecha = (date) =>
      new Intl.DateTimeFormat('es-ES', {
        dateStyle: 'full',
        timeStyle: 'medium'
      }).format(date);

    const actualizarFecha = () => {
      fechaElemento.textContent = 'Fecha: ' + formatearFecha(new Date());
    };

    actualizarFecha();
    setInterval(actualizarFecha, 1000);;;
  </script>
</body>
</html>
